[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-harmonization-agent"
version = "0.1.0"
description = "Agentic harmonization of health survey data to a standard schema (OpenAI Agents SDK)"
requires-python = ">=3.10"
dependencies = [
  "openai-agents==0.23.1",
  "pydantic>=2.7",
  "pandas>=2.0",
  "numpy>=1.26",
  "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
